<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jade Turtle Kiosk</title>
  <link rel="stylesheet" href="kiosk.css">
</head>
<body>
  <div class="kiosk">
    <section class="screen" id="menuScreen">
      <header class="header">
        <div class="brand">
          JADE TURTLE
          <small>Kiosk</small>
        </div>
      </header>
      <div class="menu-body">
        <nav class="categories">
          <button class="category" data-category="Milk Tea">Milk Tea</button>
          <button class="category" data-category="Fruit Tea">Fruit Tea</button>
          <button class="category" data-category="Coffee">Coffee</button>
          <button class="category" data-category="Smoothie">Smoothie</button>
          <button class="category" data-category="Seasonal Drink">Seasonal Drink</button>
        </nav>
        <main class="items" id="drinkGrid"></main>
      </div>
      <div class="cart-bar">
        <div>
          <strong id="cartCount">Cart (0)</strong>
          <span id="cartBarTotal">$0.00</span>
        </div>
        <button class="primary" id="cartLink">View Cart</button>
      </div>
    </section>

    <section class="screen page" id="addonScreen">
      <h1 id="drinkName"></h1>
      <p id="basePrice"></p>
      <h2>Add-Ons</h2>
      <div class="addon-list" id="addonList"></div>
      <strong class="page-total" id="customTotal"></strong>
      <div class="actions">
        <button class="secondary" id="addonBack">Back</button>
        <button class="primary" id="addToCart">Add to Cart</button>
      </div>
    </section>

    <section class="screen page" id="cartScreen">
      <h1>Your Cart</h1>
      <div class="cart-list" id="cartList"></div>
      <strong class="page-total" id="cartTotal"></strong>
      <div class="actions">
        <button class="secondary" id="keepShopping">Keep Shopping</button>
        <button class="primary" id="checkoutButton">Checkout</button>
      </div>
    </section>
  </div>
  <script src="kiosk.js"></script>
</body>
</html>
