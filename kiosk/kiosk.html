<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07523f">
  <title>The Jade Turtle | Customer Kiosk</title>
  <link rel="stylesheet" href="kiosk.css">
</head>
<body>
  <div class="kiosk">
    <section class="screen" id="menuScreen">
      <img class="brand-mark" src="JadeTurtleBubbleTeaLogo.png" alt="">
      <div class="menu-body">
        <nav class="categories">
          <div class="brand">
            The Jade Turtle
            <small>Customer Kiosk</small>
            <large></large>
            <a href="../hub/hub.html" class="hub-button">Back to Hub</a>
          </div>
          <button class="category" data-category="Milk Tea">Milk Tea</button>
          <button class="category" data-category="Fruit Tea">Fruit Tea</button>
          <button class="category" data-category="Coffee">Coffee</button>
          <button class="category" data-category="Smoothie">Smoothie</button>
          <button class="category" data-category="Seasonal Drink">Seasonal Drink</button>
          <button class="category" data-category="Favorites">Favorites</button>
        </nav>
        <main class="menu-content">
          <section class="weather-panel" aria-labelledby="weatherHeading">
            <h1 id="weatherHeading">Recommended for Today</h1>
            <p id="weatherStatus" role="status">Checking College Station weather…</p>
            <div class="weather-picks" id="weatherPicks"></div>
            <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather data by Open-Meteo</a>
          </section>
          <h2 class="menu-heading" id="categoryHeading">Milk Tea</h2>
          <div class="items" id="drinkGrid"></div>
        </main>
      </div>
      <div class="cart-bar">
        <div>
          <strong id="cartCount">Cart (0)</strong>
          <span id="cartBarTotal">$0.00</span>
        </div>
        <button class="primary" id="cartLink">View Cart</button>
      </div>
    </section>

    <section class="screen page" id="addonScreen">
      <h1 id="drinkName"></h1>
      <p id="basePrice"></p>
      <h2>Add-Ons</h2>
      <div class="addon-list" id="addonList"></div>
      <strong class="page-total" id="customTotal"></strong>
      <div class="actions">
        <button class="secondary" id="addonBack">Back</button>
        <button class="primary" id="addToCart">Add to Cart</button>
      </div>
    </section>

    <section class="screen page" id="cartScreen">
      <h1>Your Cart</h1>
      <div class="cart-list" id="cartList"></div>
      <strong class="page-total" id="cartTotal"></strong>
      <p class="checkout-message" id="checkoutMessage" role="status"></p>
      <div class="actions">
        <button class="secondary" id="keepShopping">Keep Shopping</button>
        <button class="primary" id="checkoutButton">Checkout</button>
      </div>
    </section>

    <section class="screen page" id="confirmScreen">
      <h1>Thank You!</h1>
      <p id="confirmMessage"></p>
      <div class="actions">
        <button class="primary" id="newOrder">New Order</button>
      </div>
    </section>
  </div>
  <script src="kiosk.js"></script>
</body>
</html>
